<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Laussat Studio index card</title>
  <desc id="desc">Minimal LS monogram in a square: L in serif light grey, S in sans ink.</desc>

  <rect width="1200" height="630" rx="64" fill="#F9F9F9"/>

  <!-- centered square -->
  <rect x="385" y="100" width="430" height="430" rx="56" fill="#F9F9F9" stroke="#3E4248" stroke-opacity="0.22" stroke-width="4"/>

  <!-- LS monogram -->
  <g text-anchor="middle">
    <!-- L: serif, light grey -->
    <text x="565" y="418"
          font-family="ui-serif, 'New York', 'Iowan Old Style', 'Georgia', serif"
          font-size="280" font-weight="700"
          fill="#3E4248" fill-opacity="0.42">L</text>

    <!-- S: sans, darker -->
    <text x="655" y="418"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="280" font-weight="800"
          fill="#1F2937" fill-opacity="0.86">S</text>
  </g>
</svg>
