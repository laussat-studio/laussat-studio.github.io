<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">System Design Dimensions hero</title>
  <desc id="desc">Abstract systems map with connected nodes representing architecture dimensions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f121a"/>
      <stop offset="60%" stop-color="#171d2a"/>
      <stop offset="100%" stop-color="#121722"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5e8bff" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#67d3ff" stop-opacity="0.58"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <g opacity="0.35" filter="url(#soft)">
    <circle cx="220" cy="120" r="70" fill="#4c7fff"/>
    <circle cx="1030" cy="130" r="90" fill="#53bfff"/>
    <circle cx="980" cy="470" r="120" fill="#2f5fd0"/>
  </g>

  <g stroke="url(#line)" stroke-width="3" fill="none">
    <path d="M130 350 L320 210 L520 300 L760 180 L980 260"/>
    <path d="M180 470 L360 390 L590 440 L820 340 L1050 390"/>
    <path d="M320 210 L360 390"/>
    <path d="M520 300 L590 440"/>
    <path d="M760 180 L820 340"/>
  </g>

  <g fill="#dbe7ff">
    <circle cx="130" cy="350" r="8"/>
    <circle cx="320" cy="210" r="8"/>
    <circle cx="520" cy="300" r="8"/>
    <circle cx="760" cy="180" r="8"/>
    <circle cx="980" cy="260" r="8"/>
    <circle cx="180" cy="470" r="8"/>
    <circle cx="360" cy="390" r="8"/>
    <circle cx="590" cy="440" r="8"/>
    <circle cx="820" cy="340" r="8"/>
    <circle cx="1050" cy="390" r="8"/>
  </g>

  <g fill="#f2f6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="72" y="88" font-size="44" font-weight="700">System Design Dimensions</text>
    <text x="72" y="126" font-size="22" fill="#c5d4ff">Architecture. Reliability. Delivery.</text>
  </g>
</svg>
