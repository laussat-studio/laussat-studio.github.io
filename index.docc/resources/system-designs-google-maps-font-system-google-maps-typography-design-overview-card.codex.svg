<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Google Maps Typography Design Overview card</title>
  <desc id="desc">Map card illustration: coastline, water, roads, and labels. Minimal palette, no gradients.</desc>

  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="64" fill="#F9F9F9"/>

  <!-- water -->
  <rect width="1200" height="630" rx="64" fill="#D7E3F0" opacity="0.62"/>

  <!-- land -->
  <path d="M-40 438 C118 306, 236 336, 336 300 C438 264, 550 250, 640 284 C734 320, 808 288, 898 324 C992 360, 1090 350, 1186 388 C1288 430, 1332 524, 1280 596 C1218 682, 1070 700, 924 664 C786 630, 698 584, 592 612 C460 648, 298 662, 162 620 C34 580, -102 512, -40 438 Z" fill="#EEF0F3"/>
  <path d="M-40 438 C118 306, 236 336, 336 300 C438 264, 550 250, 640 284 C734 320, 808 288, 898 324 C992 360, 1090 350, 1186 388" fill="none" stroke="#3E4248" stroke-opacity="0.22" stroke-width="3"/>

  <!-- lakes -->
  <path d="M252 430 C286 374, 372 366, 422 414 C474 464, 442 546, 368 564 C308 578, 226 504, 252 430 Z" fill="#D7E3F0" opacity="0.98"/>
  <path d="M748 448 C780 408, 850 412, 880 452 C910 494, 872 542, 820 540 C776 538, 720 498, 748 448 Z" fill="#D7E3F0" opacity="0.98"/>

  <!-- roads -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- highway -->
    <path d="M88 478 C208 358, 304 546, 432 420 C562 292, 660 496, 796 360 C932 224, 1030 426, 1112 294" stroke="#3E4248" stroke-opacity="0.20" stroke-width="22"/>
    <path d="M88 478 C208 358, 304 546, 432 420 C562 292, 660 496, 796 360 C932 224, 1030 426, 1112 294" stroke="#F9F9F9" stroke-opacity="0.90" stroke-width="10"/>

    <!-- primaries -->
    <path d="M120 218 C254 142, 344 252, 480 180 C618 108, 730 230, 866 148 C1002 70, 1090 160, 1140 124" stroke="#3E4248" stroke-opacity="0.22" stroke-width="14"/>
    <path d="M226 590 C254 460, 338 402, 424 320 C512 244, 620 234, 732 166 C850 96, 986 114, 1086 70" stroke="#3E4248" stroke-opacity="0.16" stroke-width="12"/>

    <!-- locals -->
    <path d="M456 486 C520 446, 582 452, 636 484 C690 514, 746 510, 794 482" stroke="#3E4248" stroke-opacity="0.14" stroke-width="8"/>
  </g>

  <!-- nodes -->
  <g fill="#111111" opacity="0.34">
    <circle cx="432" cy="420" r="6"/>
    <circle cx="796" cy="360" r="6"/>
    <circle cx="480" cy="180" r="5"/>
    <circle cx="866" cy="148" r="5"/>
  </g>

  <!-- title -->
  <text x="80" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#3E4248" opacity="0.85">GOOGLE MAPS TYPOGRAPHY</text>
  <text x="80" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="66" font-weight="800" fill="#111111">Typography Design Overview</text>
  <text x="80" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" fill="#3E4248" opacity="0.9">Case Study</text>

  <!-- small labels -->
  <g filter="url(#soft)">
    <rect x="864" y="92" width="156" height="40" rx="20" fill="#F9F9F9" opacity="0.82"/>
    <text x="886" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#111111" opacity="0.78">Bay</text>
  </g>
</svg>
