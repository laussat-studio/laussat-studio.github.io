<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Google Maps Typography Design Overview card</title>
  <desc id="desc">Minimal maps abstract card: translucent green landmass and solid water shapes.</desc>

  <rect width="1200" height="630" rx="64" fill="#F9F9F9"/>

  <!-- landmass: translucent green blob, fills the card -->
  <path d="M-40 420 C120 250, 360 220, 520 290 C640 346, 760 326, 900 380 C1060 444, 1250 410, 1280 480 C1316 566, 1160 704, 900 682 C720 666, 642 610, 520 636 C360 684, 120 704, -20 650 C-120 610, -120 500, -40 420 Z" fill="#22C55E" opacity="0.18"/>

