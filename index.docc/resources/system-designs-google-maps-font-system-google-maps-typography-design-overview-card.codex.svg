<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Google Maps Typography Design Overview card</title>
  <desc id="desc">Recognizable map pictogram card: folded map with a pin and title text.</desc>

  <rect width="1200" height="630" rx="64" fill="#F9F9F9"/>

  <!-- folded map pictogram (center-right) -->
  <g transform="translate(640,120) scale(1.0)">
    <path d="M0 80 L150 40 L150 410 L0 450 Z" fill="#EEF0F3" stroke="#3E4248" stroke-opacity="0.35" stroke-width="4"/>
    <path d="M150 40 L300 80 L300 450 L150 410 Z" fill="#F9F9F9" stroke="#3E4248" stroke-opacity="0.35" stroke-width="4"/>
    <path d="M300 80 L450 40 L450 410 L300 450 Z" fill="#EEF0F3" stroke="#3E4248" stroke-opacity="0.35" stroke-width="4"/>
    <path d="M150 40 V410" fill="none" stroke="#3E4248" stroke-opacity="0.18" stroke-width="4"/>
    <path d="M300 80 V450" fill="none" stroke="#3E4248" stroke-opacity="0.18" stroke-width="4"/>

    <!-- pin -->
    <path d="M200 210 C200 178, 226 152, 258 152 C290 152, 316 178, 316 210 C316 262, 258 334, 258 334 C258 334, 200 262, 200 210 Z" fill="#111111" opacity="0.92"/>
    <circle cx="258" cy="210" r="14" fill="#F9F9F9" opacity="0.95"/>
  </g>

  <!-- title -->
  <g>
    <text x="80" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#3E4248" opacity="0.85">GOOGLE MAPS TYPOGRAPHY</text>
    <text x="80" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="66" font-weight="800" fill="#111111">Typography Design Overview</text>
    <text x="80" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" fill="#3E4248" opacity="0.9">Case Study</text>
  </g>
</svg>
