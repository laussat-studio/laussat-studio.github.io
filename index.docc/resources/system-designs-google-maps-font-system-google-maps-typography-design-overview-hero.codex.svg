<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Google Maps Typography Design Overview hero</title>
  <desc id="desc">Recognizable map pictogram hero: folded map with a pin and label.</desc>

  <rect width="1200" height="600" rx="56" fill="#F9F9F9"/>

  <!-- large pictogram (centered) -->
  <g transform="translate(220,52) scale(1.15)">
    <path d="M0 120 L220 70 L220 520 L0 580 Z" fill="#EEF0F3" stroke="#3E4248" stroke-opacity="0.35" stroke-width="4"/>
    <path d="M220 70 L440 120 L440 580 L220 520 Z" fill="#F9F9F9" stroke="#3E4248" stroke-opacity="0.35" stroke-width="4"/>
    <path d="M440 120 L660 70 L660 520 L440 580 Z" fill="#EEF0F3" stroke="#3E4248" stroke-opacity="0.35" stroke-width="4"/>
    <path d="M220 70 V520" fill="none" stroke="#3E4248" stroke-opacity="0.18" stroke-width="4"/>
    <path d="M440 120 V580" fill="none" stroke="#3E4248" stroke-opacity="0.18" stroke-width="4"/>

    <!-- pin (centered) -->
    <path d="M306 292 C306 254, 336 224, 374 224 C412 224, 442 254, 442 292 C442 356, 374 442, 374 442 C374 442, 306 356, 306 292 Z" fill="#111111" opacity="0.92"/>
    <circle cx="374" cy="292" r="16" fill="#F9F9F9" opacity="0.95"/>
  </g>

</svg>
