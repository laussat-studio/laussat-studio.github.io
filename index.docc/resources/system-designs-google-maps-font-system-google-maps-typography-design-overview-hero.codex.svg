<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Google Maps Typography Design Overview hero</title>
  <desc id="desc">Minimal maps abstract: translucent green landmass and solid water shapes.</desc>

  <!-- background (paper) -->
  <rect width="1200" height="600" rx="56" fill="#F9F9F9"/>

  <!-- landmass: full-bleed translucent green blob -->
  <path d="M-40 390 C120 230, 360 180, 520 250 C640 304, 760 276, 900 332 C1060 398, 1250 360, 1280 430 C1320 520, 1160 650, 900 630 C720 616, 640 560, 520 586 C360 628, 120 650, -20 600 C-120 564, -120 470, -40 390 Z" fill="#22C55E" opacity="0.18"/>

  <!-- water: non-transparent bodies -->
  <path d="M150 360 C210 300, 330 292, 404 340 C470 384, 540 380, 610 344 C676 310, 768 312, 820 350 C884 396, 860 466, 780 492 C702 516, 642 470, 560 486 C470 504, 410 552, 330 534 C248 516, 198 450, 150 414 C118 390, 110 400, 150 360 Z" fill="#D7E3F0"/>

  <path d="M760 164 C808 128, 884 132, 928 166 C972 200, 1032 194, 1064 216 C1102 242, 1096 292, 1052 314 C1004 338, 960 312, 916 296 C872 280, 836 304, 796 288 C752 270, 726 196, 760 164 Z" fill="#D7E3F0"/>

  <!-- label -->
  <g>
    <rect x="72" y="72" width="560" height="104" rx="28" fill="#0A0A0A" opacity="0.92"/>
    <text x="96" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="800" fill="#F9F9F9">Google Maps Typography</text>
    <text x="96" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#F9F9F9" opacity="0.82">Typography Design Overview</text>
  </g>
</svg>
