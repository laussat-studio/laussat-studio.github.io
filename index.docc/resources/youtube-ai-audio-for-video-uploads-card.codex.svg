<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">YouTube AI Audio for Video Uploads card</title>
  <desc id="desc">Pictogram card: video screen with play button (no text).</desc>

  <rect width="1200" height="630" rx="64" fill="#F9F9F9"/>

  <!-- centered screen -->
  <g transform="translate(340,120) scale(1.25)">
    <rect x="0" y="0" width="460" height="340" rx="56" fill="#EEF0F3" stroke="#3E4248" stroke-opacity="0.35" stroke-width="4"/>
    <rect x="36" y="36" width="388" height="268" rx="44" fill="#F9F9F9" stroke="#3E4248" stroke-opacity="0.18" stroke-width="4"/>

    <!-- play button -->
    <circle cx="230" cy="170" r="76" fill="#1F2937" opacity="0.10"/>
    <path d="M212 132 L212 208 L286 170 Z" fill="#1F2937" opacity="0.86"/>
  </g>
</svg>
