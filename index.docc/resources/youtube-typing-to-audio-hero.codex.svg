<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Keyboard to audio flow with visual stages</title>
  <desc id="desc">Five-stage flow with pictograms and roman numeral tags: typing, local neural engine, debounce timer, network request, and cloud audio response.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090f1d"/>
      <stop offset="56%" stop-color="#1f1037"/>
      <stop offset="100%" stop-color="#34101f"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2d55"/>
      <stop offset="48%" stop-color="#ff8ca4"/>
      <stop offset="100%" stop-color="#57d9ff"/>
    </linearGradient>
    <filter id="blur" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

