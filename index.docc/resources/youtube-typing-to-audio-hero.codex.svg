<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Keyboard to audio flow with roman numerals</title>
  <desc id="desc">Visual flow showing five stages using roman numerals from keystroke through network audio response.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090f1d"/>
      <stop offset="56%" stop-color="#1f1037"/>
      <stop offset="100%" stop-color="#34101f"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2d55"/>
      <stop offset="48%" stop-color="#ff8ca4"/>
      <stop offset="100%" stop-color="#57d9ff"/>
    </linearGradient>
    <filter id="blur" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#ffe4ec"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g opacity="0.2" filter="url(#blur)">
    <circle cx="220" cy="160" r="130" fill="#ff2d55"/>
    <circle cx="1400" cy="760" r="210" fill="#46a7ff"/>
  </g>

  <g fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="8 12">
    <line x1="800" y1="150" x2="800" y2="760"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="110" y="318" width="190" height="190" rx="36" fill="#291826" stroke="#ff8da8" stroke-width="3"/>
    <text x="205" y="436" text-anchor="middle" font-size="92" font-weight="800" fill="#ffffff">I</text>

    <rect x="490" y="190" width="240" height="190" rx="36" fill="#18273b" stroke="#84c1ff" stroke-width="3"/>
    <text x="610" y="308" text-anchor="middle" font-size="92" font-weight="800" fill="#ffffff">II</text>

    <rect x="490" y="526" width="240" height="190" rx="36" fill="#2b1b35" stroke="#d2a6ff" stroke-width="3"/>
    <text x="610" y="644" text-anchor="middle" font-size="92" font-weight="800" fill="#ffffff">III</text>

    <rect x="910" y="318" width="240" height="190" rx="36" fill="#2a1821" stroke="#ffa1b5" stroke-width="3"/>
    <text x="1030" y="436" text-anchor="middle" font-size="92" font-weight="800" fill="#ffffff">IV</text>

    <rect x="1290" y="318" width="210" height="190" rx="36" fill="#172537" stroke="#7cd0ff" stroke-width="3"/>
    <text x="1395" y="436" text-anchor="middle" font-size="92" font-weight="800" fill="#ffffff">V</text>
  </g>

  <g stroke="url(#line)" stroke-width="6" fill="none" marker-end="url(#arrow)" stroke-linecap="round">
    <path d="M300 413 C390 413, 420 305, 490 285"/>
    <path d="M300 413 C390 413, 420 600, 490 620"/>
    <path d="M730 285 C820 305, 860 390, 910 413"/>
    <path d="M730 620 C820 600, 860 436, 910 413"/>
    <path d="M1150 413 L1290 413"/>
  </g>
</svg>
