<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Google Maps Typography Design Overview icon</title>
  <desc id="desc">Abstract map tile with landmass, lakes, and roads (no highlighted route).</desc>

  <!-- rismay-minimal (maps section): neutral paper + topology, no gradients -->
  <rect width="512" height="512" rx="96" fill="#F9F9F9"/>

  <!-- landmass -->
  <g opacity="0.95">
    <path d="M84 188 C142 110, 232 106, 284 152 C322 186, 356 170, 402 210 C448 250, 444 322, 394 358 C352 388, 332 430, 262 438 C198 444, 154 418, 130 380 C104 338, 78 290, 90 244 C98 214, 70 208, 84 188 Z" fill="#EEF0F3"/>
    <path d="M156 118 C202 88, 268 92, 308 126 C330 144, 360 134, 390 154 C418 172, 424 206, 408 232 C390 260, 354 264, 322 250 C292 238, 264 248, 232 244 C196 240, 170 220, 156 196 C142 172, 128 140, 156 118 Z" fill="#E7EAEE" opacity="0.9"/>
  </g>

  <!-- lakes -->
  <g opacity="0.9">
    <path d="M156 300 C174 272, 214 270, 232 294 C250 320, 238 356, 206 366 C178 374, 144 338, 156 300 Z" fill="#D7E3F0"/>
    <path d="M318 314 C336 294, 370 298, 382 322 C394 346, 374 372, 346 372 C324 372, 304 344, 318 314 Z" fill="#D7E3F0" opacity="0.95"/>
  </g>

  <!-- roads -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M116 344 C168 286, 214 374, 270 324 C324 276, 366 334, 404 302" stroke="#3E4248" stroke-opacity="0.55" stroke-width="14"/>
    <path d="M122 208 C176 176, 222 220, 282 186 C332 158, 372 184, 406 166" stroke="#3E4248" stroke-opacity="0.40" stroke-width="10"/>
    <path d="M182 430 C188 356, 240 332, 268 286 C300 232, 332 232, 362 128" stroke="#3E4248" stroke-opacity="0.28" stroke-width="10"/>
  </g>

  <!-- nodes -->
  <g fill="#111111" opacity="0.45">
    <circle cx="116" cy="344" r="6"/>
    <circle cx="270" cy="324" r="6"/>
    <circle cx="404" cy="302" r="6"/>
  </g>
</svg>
