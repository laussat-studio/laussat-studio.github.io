<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Google Maps Typography Design Overview icon</title>
  <desc id="desc">Clean map tile icon: water, coastline, and road hierarchy.</desc>

  <!-- palette: paper #F9F9F9, water #D7E3F0, ink #111111, road #3E4248 -->
  <rect width="512" height="512" rx="96" fill="#F9F9F9"/>

  <!-- water base -->
  <rect width="512" height="512" rx="96" fill="#D7E3F0" opacity="0.70"/>

  <!-- land (light tint) -->
  <path d="M-24 364 C52 300, 128 314, 172 292 C224 266, 274 254, 326 272 C378 290, 420 274, 468 300 C512 324, 560 322, 556 380 C550 458, 474 558, 334 544 C250 536, 210 492, 162 504 C102 520, 18 520, -14 474 C-46 428, -56 392, -24 364 Z" fill="#EEF0F3" opacity="0.92"/>

  <!-- coastline (crisp) -->
  <path d="M-24 364 C52 300, 128 314, 172 292 C224 266, 274 254, 326 272 C378 290, 420 274, 468 300" fill="none" stroke="#3E4248" stroke-opacity="0.28" stroke-width="3"/>

  <!-- road hierarchy -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- highway casing -->
    <path d="M72 392 C126 338, 170 416, 234 360 C296 306, 332 376, 444 300" stroke="#3E4248" stroke-opacity="0.26" stroke-width="18"/>
    <path d="M72 392 C126 338, 170 416, 234 360 C296 306, 332 376, 444 300" stroke="#F9F9F9" stroke-opacity="0.92" stroke-width="8"/>

    <!-- primaries -->
    <path d="M96 180 C156 144, 202 186, 262 156 C310 132, 352 152, 440 116" stroke="#3E4248" stroke-opacity="0.22" stroke-width="10"/>
    <path d="M168 442 C184 378, 230 352, 256 308 C286 254, 318 252, 346 132" stroke="#3E4248" stroke-opacity="0.18" stroke-width="10"/>

    <!-- locals -->
    <path d="M292 404 C318 388, 342 388, 364 402 C386 416, 408 416, 426 404" stroke="#3E4248" stroke-opacity="0.14" stroke-width="7"/>
  </g>

  <!-- nodes -->
  <g fill="#111111" opacity="0.30">
    <circle cx="234" cy="360" r="6"/>
    <circle cx="262" cy="156" r="5"/>
    <circle cx="444" cy="300" r="6"/>
  </g>
</svg>
