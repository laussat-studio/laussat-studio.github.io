<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Audio to video edit and upload flow</title>
  <desc id="desc">Diagram of generated audio entering editor timeline, mixing with video tracks, preview validation, and upload to Shorts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1222"/>
      <stop offset="55%" stop-color="#1a1f38"/>
      <stop offset="100%" stop-color="#351428"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#48c6ff"/>
      <stop offset="48%" stop-color="#8a8dff"/>
      <stop offset="100%" stop-color="#ff4d6d"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#e4e9ff"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="70" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="700" fill="#ffffff">Flow 2: Audio -> Video Edit -> Upload</text>
  <text x="70" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" fill="#dce7ff">generated audio -> timeline mix -> creator preview -> final render -> upload</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="70" y="220" width="260" height="140" rx="22" fill="#17273b" stroke="#76ceff" stroke-width="2"/>
    <text x="95" y="266" font-size="30" font-weight="700" fill="#ffffff">Generated Audio</text>
    <path d="M95 314 C115 282, 135 346, 155 314 C175 282, 195 346, 215 314 C235 282, 255 346, 275 314" stroke="#9fe2ff" stroke-width="4" fill="none"/>
    <text x="95" y="346" font-size="21" fill="#d8f4ff">voice clip ready</text>

    <rect x="390" y="200" width="500" height="300" rx="24" fill="#1d1f34" stroke="#96a3ff" stroke-width="2"/>
    <text x="420" y="246" font-size="31" font-weight="700" fill="#ffffff">On-Device Video Editor Timeline</text>
    <rect x="420" y="278" width="440" height="42" rx="10" fill="#112031" stroke="#5db4ff" stroke-width="2"/>
    <text x="434" y="306" font-size="19" fill="#d9f1ff">Video track</text>
    <rect x="420" y="336" width="360" height="42" rx="10" fill="#24183a" stroke="#cc9cff" stroke-width="2"/>
    <text x="434" y="364" font-size="19" fill="#f1ddff">Narration track A</text>
    <rect x="420" y="394" width="410" height="42" rx="10" fill="#2b1730" stroke="#ff90b0" stroke-width="2"/>
    <text x="434" y="422" font-size="19" fill="#ffe1ea">Narration track B</text>
    <text x="420" y="470" font-size="21" fill="#dce6ff">supports up to 20 overlapping audio stickers</text>

    <rect x="940" y="220" width="280" height="140" rx="22" fill="#20232f" stroke="#ff9eb4" stroke-width="2"/>
    <text x="966" y="266" font-size="30" font-weight="700" fill="#ffffff">Creator Preview</text>
    <text x="966" y="302" font-size="22" fill="#ffe2eb">timing + quality check</text>
    <text x="966" y="334" font-size="22" fill="#ffe2eb">edit until accepted</text>

    <rect x="940" y="420" width="280" height="140" rx="22" fill="#182938" stroke="#7ccfff" stroke-width="2"/>
    <text x="966" y="466" font-size="30" font-weight="700" fill="#ffffff">Final Composition</text>
    <text x="966" y="502" font-size="22" fill="#d8f5ff">mux video + audio</text>
    <text x="966" y="534" font-size="22" fill="#d8f5ff">prepare upload asset</text>

    <rect x="1270" y="320" width="260" height="170" rx="22" fill="#2c1726" stroke="#ff6f92" stroke-width="2"/>
    <text x="1296" y="366" font-size="30" font-weight="700" fill="#ffffff">YouTube Upload</text>
    <text x="1296" y="402" font-size="22" fill="#ffe0e9">Shorts publish path</text>
    <text x="1296" y="434" font-size="22" fill="#ffe0e9">experiment cohort gates</text>
  </g>

  <g stroke="url(#line)" stroke-width="5" fill="none" marker-end="url(#arrow)" stroke-linecap="round">
    <path d="M330 290 L390 290"/>
    <path d="M890 290 L940 290"/>
    <path d="M1080 360 L1080 420"/>
    <path d="M1220 490 L1270 420"/>
    <path d="M1220 280 C1260 260, 1300 260, 1320 300"/>
    <path d="M1080 560 C1080 650, 610 720, 300 600"/>
  </g>

  <text x="1126" y="626" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#f3dfe7">rollback path if composition limits regress</text>
</svg>
