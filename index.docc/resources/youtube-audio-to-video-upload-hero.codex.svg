<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Audio to upload flow with visual stages</title>
  <desc id="desc">Five-stage flow with pictograms and roman numeral tags: generated audio, timeline edit, creator preview, final composition, and upload.</desc>
  <defs>
