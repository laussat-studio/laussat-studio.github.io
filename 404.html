<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting…</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <script>
      (function () {
        var path = window.location.pathname || "/";
        var search = window.location.search || "";
        var hash = window.location.hash || "";

        // Canonical docs root
        if (path === "/documentation/index" || path === "/documentation/index/") {
          window.location.replace("/documentation/index/" + search + hash);
          return;
        }

        // Legacy DocC tech root -> canonical docs root
        if (path === "/documentation/studio-laussat" || path === "/documentation/studio-laussat/") {
          window.location.replace("/documentation/index/" + search + hash);
          return;
        }
        var legacyPrefix = "/documentation/studio-laussat/";
        if (path.startsWith(legacyPrefix)) {
          var rest = path.slice(legacyPrefix.length);
          window.location.replace("/documentation/index/" + rest + search + hash);
          return;
        }

        // Default: send to docs root (better than a dead end)
        window.location.replace("/documentation/index/" + search + hash);
      })();
    </script>
  </body>
</html>
