<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting…</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <script>
      (function () {
        var path = window.location.pathname || "/";
        var search = window.location.search || "";
        var hash = window.location.hash || "";
        var docPrefix = "/documentation/";

        if (path.startsWith(docPrefix)) {
          var rest = path.slice(docPrefix.length);
          var segments = rest.split("/").filter(Boolean);
          var trailingSlash = path.endsWith("/") ? "/" : "";

          if (segments.length === 0) {
            window.location.replace("/documentation/index/" + search + hash);
            return;
          }

          if (segments[0] === "index") {
            segments = segments.slice(1);
          } else if (segments.length > 1) {
            // If there is an extra leading tech-root segment, drop it.
            segments = segments.slice(1);
          }

          var destination = "/documentation/index/";
          if (segments.length > 0) {
            destination += segments.join("/") + trailingSlash;
          }
          window.location.replace(destination + search + hash);
          return;
        }

        window.location.replace("/documentation/index/" + search + hash);
      })();
    </script>
  </body>
</html>
