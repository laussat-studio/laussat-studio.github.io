name: Publish DocC

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2'

      - name: Build DocC
        run: |
          set -euo pipefail
          output_root="${GITHUB_WORKSPACE}/_site"
          rm -rf "${output_root}"
          mkdir -p "${output_root}"
          docc convert "index.docc" \
            --output-path "${output_root}" \
            --transform-for-static-hosting \
            --hosting-base-path / \
            --experimental-enable-custom-templates \
            --fallback-display-name "Studio Laussat"
          # Documentation index fallback (only when DocC didn't generate it).
          if [ -f "documentation/index/index.html" ] && [ ! -f "${output_root}/documentation/index/index.html" ]; then
            mkdir -p "${output_root}/documentation/index"
            cp "documentation/index/index.html" "${output_root}/documentation/index/index.html"
          fi
          # Root landing page: branded OG/Twitter preview + redirect into DocC.
          cat > "${output_root}/index.html" <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1"/>
            <title>Studio Laussat</title>
            <meta name="description" content="Studio Laussat — system design studio."/>
            <link rel="canonical" href="https://laussat.studio/"/>

            <meta property="og:type" content="website"/>
            <meta property="og:title" content="Studio Laussat"/>
            <meta property="og:description" content="System design, architecture, and production-scale delivery."/>
            <meta property="og:image" content="https://github.com/laussat-studio.png?size=512"/>

            <meta name="twitter:card" content="summary_large_image"/>
            <meta name="twitter:title" content="Studio Laussat"/>
            <meta name="twitter:description" content="System design, architecture, and production-scale delivery."/>
            <meta name="twitter:image" content="https://github.com/laussat-studio.png?size=512"/>

            <meta http-equiv="refresh" content="0; url=/documentation/index/"/>
            <script>
              window.location.replace('/documentation/index/');
            </script>
            <style>
              :root { color-scheme: light dark; }
              body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: -apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
              .wrap { text-align: center; padding: 28px 18px; }
              .title { font-size: 20px; letter-spacing: -0.02em; }
              .sub { margin-top: 8px; opacity: 0.75; font-size: 13px; }
            </style>
          </head>
          <body>
            <div class="wrap">
              <div class="title">Studio Laussat</div>
              <div class="sub">Loading documentation…</div>
            </div>
          </body>
          </html>
          EOF
          touch "${output_root}/.nojekyll"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    strategy:
      matrix:
        os: [ubuntu-latest]
    needs: build
    runs-on: ${{ matrix.os }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}documentation/index/
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print Deployed URL
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}documentation/index/"
