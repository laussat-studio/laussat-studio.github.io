name: Publish DocC

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2'

      - name: Build DocC
        run: |
          set -euo pipefail
          # Runbook: docs/docc-hosting-basepath.md
          output_root="${GITHUB_WORKSPACE}/_site"
          rm -rf "${output_root}"
          mkdir -p "${output_root}"
          docc convert "index.docc" \
            --output-path "${output_root}" \
            --transform-for-static-hosting \
            --hosting-base-path / \
            --experimental-enable-custom-templates \
            --fallback-display-name "Studio Laussat"

          # Optional compatibility: if we have a legacy redirect stub at documentation/index/index.html,
          # copy it through (but do not overwrite DocC output).
          if [ -f "documentation/index/index.html" ] && [ ! -f "${output_root}/documentation/index/index.html" ]; then
            mkdir -p "${output_root}/documentation/index"
            cp "documentation/index/index.html" "${output_root}/documentation/index/index.html"
          fi

          # Redirect vanity paths -> canonical tech-root (redirect-only; do not overwrite DocC output)
          mkdir -p "${output_root}/documentation"

          # /documentation/ -> /documentation/studio-laussat/index/
          cat > "${output_root}/documentation/index.html" <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1"/>
            <meta name="robots" content="noindex"/>
            <title>Studio Laussat</title>
            <meta http-equiv="refresh" content="0; url=/documentation/studio-laussat/index/"/>
            <script>window.location.replace('/documentation/studio-laussat/index/');</script>
          </head>
          <body></body>
          </html>
          EOF

          # /documentation/index/ -> /documentation/studio-laussat/index/
          mkdir -p "${output_root}/documentation/index"
          cat > "${output_root}/documentation/index/index.html" <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1"/>
            <meta name="robots" content="noindex"/>
            <title>Studio Laussat</title>
            <meta http-equiv="refresh" content="0; url=/documentation/studio-laussat/index/"/>
            <script>window.location.replace('/documentation/studio-laussat/index/');</script>
          </head>
          <body></body>
          </html>
          EOF
          # Static assets for link previews (kept simple + on-brand; not "techy")
          mkdir -p "${output_root}/assets"
          if [ -f "assets/og-laussat.svg" ]; then
            cp "assets/og-laussat.svg" "${output_root}/assets/og-laussat.svg"
          fi

          # Root landing page: branded OG/Twitter preview + redirect into DocC.
          cat > "${output_root}/index.html" <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1"/>
            <title>Studio Laussat</title>
            <meta name="description" content="System design studio."/>
            <link rel="canonical" href="https://laussat.studio/"/>

            <meta property="og:type" content="website"/>
            <meta property="og:title" content="Studio Laussat"/>
            <meta property="og:description" content="System design studio."/>
            <meta property="og:image" content="https://laussat.studio/assets/og-laussat.svg"/>

            <meta name="twitter:card" content="summary_large_image"/>
            <meta name="twitter:title" content="Studio Laussat"/>
            <meta name="twitter:description" content="System design studio."/>
            <meta name="twitter:image" content="https://laussat.studio/assets/og-laussat.svg"/>

            <meta http-equiv="refresh" content="0; url=/documentation/studio-laussat/index/"/>
            <script>
              window.location.replace('/documentation/studio-laussat/index/');
            </script>
            <style>
              :root { color-scheme: light dark; }
              body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: ui-serif, Georgia, "Times New Roman", serif; background: #F7F3ED; color: #111; }
              .wrap { text-align: center; padding: 56px 18px; }
              .title { font-size: 22px; letter-spacing: -0.02em; }
              .sub { margin-top: 10px; opacity: 0.72; font-size: 14px; }
              a { color: inherit; }
            </style>
          </head>
          <body>
            <div class="wrap">
              <div class="title">Studio Laussat</div>
              <div class="sub">Redirecting…</div>
            </div>
          </body>
          </html>
          EOF

          # Fix common "white page" failure mode: ensure assets exist where the DocC shell expects them.
          # With canonical root /documentation/studio-laussat, ensure assets exist under that prefix.
          if [ -d "${output_root}/css" ] && [ ! -d "${output_root}/documentation/studio-laussat/css" ]; then
            mkdir -p "${output_root}/documentation/studio-laussat/css"
            cp -R "${output_root}/css/." "${output_root}/documentation/studio-laussat/css/"
          fi
          if [ -d "${output_root}/js" ] && [ ! -d "${output_root}/documentation/studio-laussat/js" ]; then
            mkdir -p "${output_root}/documentation/studio-laussat/js"
            cp -R "${output_root}/js/." "${output_root}/documentation/studio-laussat/js/"
          fi

          # DocC render uses a BASE_PATH placeholder in JS/CSS that must match window.baseUrl.
          # This must run AFTER any path-copy steps (so we don't overwrite the rewritten files).
          find "${output_root}" -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print0 \
            | xargs -0 perl -0777 -pi -e 's#\{\{BASE_PATH\}\}#/documentation/studio-laussat#g'

          # OG/Twitter tags on the DocC entrypoint itself (nice unfurls when sharing a docs URL).
          if [ -f "${output_root}/documentation/studio-laussat/index.html" ]; then
            perl -0777 -pi -e 's#<head>#<head><meta property="og:type" content="website"/><meta property="og:title" content="Studio Laussat"/><meta property="og:description" content="System design studio."/><meta property="og:image" content="https://laussat.studio/assets/og-laussat.svg"/><meta name="twitter:card" content="summary_large_image"/><meta name="twitter:title" content="Studio Laussat"/><meta name="twitter:description" content="System design studio."/><meta name="twitter:image" content="https://laussat.studio/assets/og-laussat.svg"/>#' "${output_root}/documentation/studio-laussat/index.html" || true
          fi

          touch "${output_root}/.nojekyll"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    strategy:
      matrix:
        os: [ubuntu-latest]
    needs: build
    runs-on: ${{ matrix.os }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}documentation/index/
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print Deployed URL
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}documentation/index/"
